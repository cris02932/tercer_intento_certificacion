
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoluntaMe</title>
</head>
<body>
    <h1>Editar Misión</h1>
    <a href="/dashboard">Inicio</a>
    <a href="/cerrar_sesion">Cerrar sesión</a>

    {% with mensajes = get_flashed_messages(category_filter=['mision']) %}
        {% for mensaje in mensajes %}
            <p>{{ mensaje }}</p>
        {% endfor %}
    {% endwith %}
    <form action="/actualizar_mision/{{ mision.id }}" method="POST">
        <p>Nombre:<input type="text" name="nombre" value="{{ mision.nombre }}" required></p>
        <p>Fecha:<input type="date" name="fecha" value="{{ mision.fecha.strftime('%Y-%m-%d') if mision.fecha else '' }}" required></p>
        <p>Voluntarios Necesarios:<input type="number" name="voluntarios" min="2" max="20" value="{{ mision.voluntarios }}" required></p>
        <p>Descripción:<textarea name="descripcion" rows="4" cols="50" required>{{ mision.descripcion }}</textarea></p>
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
