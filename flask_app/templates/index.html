<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoluntaMe</title>    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% if mensajes %}
            {% for categoria, mensaje in mensajes %}
                <p class="{{ categoria }}">{{ mensaje }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="/crear_usuario" method="post">
        <h2>Registro</h2>
        <br>
        <label for="nombre_usuario_registro">Nombre:</label>
        <input type="text" name="nombre" id="nombre_usuario_registro" required>
        <br>
        <label for="apellido_usuario_registro">Apellido:</label>
        <input type="text" name="apellido" id="apellido_usuario_registro" required>
        <br>
        <label for="email_usuario_registro">E-mail:</label>
        <input type="email" name="email" id="email_usuario_registro" required>
        <br>
        <label for="password_usuario_registro">Contraseña:</label>
        <input type="password" name="password" id="password_usuario_registro" required>
        <br>
        <label for="password_usuario_registro_conf">Confirmar Contraseña:</label>
        <input type="password" name="password_conf" id="password_usuario_registro_conf" required>
        <br>
        <input type="submit" value="Registrar">
    </form>

    <form action="/iniciar_sesion" method="post">
        <h2>Inicio de Sesion</h2>
        <br>
        <label for="email_inicio_sesion">E-mail</label>
        <input type="email" name="email_inicio_sesion" id="email_inicio_sesion" required>
        <br>
        <label for="password_inicio_sesion">Password:</label>
        <input type="password" name="password_inicio_sesion" id="password_inicio_sesion" required>
        <br>
        <input type="submit" value="Inicio de sesión">
    </form>
</body>
</html>
